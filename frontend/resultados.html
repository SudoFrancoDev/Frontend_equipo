<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DATARA · Resultados de búsqueda</title>
  <meta name="description" content="Busca con lenguaje natural y recibe recomendaciones inteligentes basadas en IA.">
  <link rel="icon" href="assets/logo-datara.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261025-2">
</head>
<body>

  <!-- Degradado del logo (se reutiliza en todos los íconos de marca) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="datara-grad" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="100" y2="0">
        <stop offset="0" stop-color="#2563EB"/>
        <stop offset="1" stop-color="#06B6D4"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ===== Encabezado ===== -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="DATARA, ir al inicio">
        <svg class="brand__icon" viewBox="0 0 100 100" aria-hidden="true">
          <path class="arm" d="M50 50 L15 27 M50 50 L15 68 M50 50 L65 84 M50 50 L85 54 M50 50 L76 16"/>
          <circle class="node" cx="15" cy="27" r="7"/>
          <circle class="node" cx="15" cy="68" r="7"/>
          <circle class="node" cx="65" cy="84" r="7"/>
          <circle class="node" cx="85" cy="54" r="6"/>
          <circle class="node" cx="76" cy="16" r="7"/>
          <circle class="node" cx="50" cy="50" r="15"/>
          <circle class="core" cx="50" cy="50" r="5.5"/>
        </svg>
        <svg class="brand__word" viewBox="0 0 180 34" aria-hidden="true">
          <path d="M2 2 H12 A15 15 0 0 1 12 32 H2 Z"/>
          <path d="M34 32 L48 2 L62 32"/>
          <path d="M66 2 H88 M77 2 V32"/>
          <path d="M90 32 L104 2 L118 32"/>
          <path d="M126 32 V2 H138 A8 8 0 0 1 138 18 H126 M136 18 L146 32"/>
          <path d="M150 32 L164 2 L178 32"/>
        </svg>
      </a>

      <nav class="main-nav" aria-label="Principal">
        <a href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          Inicio
        </a>
        <a href="resultados.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          Explorar
        </a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Cambiar tema claro u oscuro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="avatar" aria-label="Tu cuenta">SF</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="results-head">
      <form class="search search--compact" action="resultados.html" method="get" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="visually-hidden" for="q">Buscar artículos</label>
        <input id="q" name="q" type="search" placeholder="¿Qué tema te gustaría explorar hoy?" autocomplete="off">
        <button class="btn btn--primary" type="submit">Buscar</button>
      </form>

      <!-- script.js ajusta el título según el modo: búsqueda (?q=), similares (?similar=) o exploración -->
      <div>
        <h1 id="resultsTitle">Resultados de búsqueda</h1>
        <p class="results-count" id="resultsCount" aria-live="polite"></p>
      </div>

      <!-- Filtro por categoría, calculado a partir de los resultados -->
      <div class="filters" id="filters" aria-label="Filtros" hidden>
        <div class="filter-group" id="categoryFilter">
          <span class="filter-group__label">Categorías</span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="card-list" id="results" aria-live="polite">
        <div class="state"><span class="spinner" aria-hidden="true"></span><p>Cargando artículos…</p></div>
      </div>

      <div class="load-more" id="loadMore" hidden>
        <button class="btn btn--outline" type="button">Cargar más artículos</button>
      </div>

      <div class="related" id="related" aria-label="Temas relacionados" hidden>
        <span class="filter-group__label">Temas relacionados</span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>DATARA · Intelligent Search &amp; Knowledge Discovery</p>
      <p>Conectando información para descubrir conocimiento.</p>
    </div>
  </footer>

  <script src="config.js?v=20261025-2"></script>
  <script src="script.js?v=20261025-2"></script>
</body>
</html>
